name: Publish image

# 推送到 main、推版本标签（v*）或手动触发时构建并发布（amd64 + arm64）；
# PR 只构建 linux/amd64 验证 Dockerfile，不登录 GHCR、不发布（arm64 走 QEMU 太慢，PR 不划算）。
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # 需要 tag 历史：非 tag 构建用 git describe 推导快照号。
          fetch-depth: 0

      - name: Read source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 版本号注入规则：
      #   tag v4.5.0                    -> 4.5.0
      #   其它（main / PR / 手动分支）   -> 快照号 <最近tag>-SNAPSHOT-<短sha>，如 4.4.0-SNAPSHOT-8d598e3
      # PR 只构建不发布，快照号带上 sha 也没有副作用。
      - name: Resolve build version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            base="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            base="${base#v}"
            short="$(git rev-parse --short HEAD)"
            value="${base:-0.0.0}-SNAPSHOT-${short}"
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 标签规则：
      #   main  -> latest + sha-<sha>
      #   v2.10.0 -> 2.10.0、2.10 + sha-<sha>（latest 仍只跟 main）
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # PR 只用 amd64 验证 Dockerfile；发布分支/标签才构建 arm64（需 QEMU）。
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
