name: Static checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# 只做离线检查：lint、格式、依赖审计、离线测试。
# 真实联调（npm run test:live）刻意不放进 CI：它依赖真实模型和免费层配额，
# 上游瞬时限流、模型偶发不服从指令都会让结果不稳定，作为门禁只会产生假警报。
# 需要联调时本地执行 `npm run test:live`。
jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Run offline tests
        run: npm test
